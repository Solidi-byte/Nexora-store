<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeXora | Member Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #050505; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #0d0d0d; border: 1px solid #1a1a1a; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: 700; letter-spacing: 4px; color: #fff; text-decoration: none; display: block; margin-bottom: 30px; }
        h2 { font-size: 18px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; color: #ccc; }
        form p { margin-bottom: 16px; text-align: left; font-size: 13px; color: #aaa; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 6px; background: #141414; border: 1px solid #262626; color: #fff; border-radius: 0; }
        button { width: 100%; padding: 14px; background: #fff; color: #000; border: none; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        .switch-link { margin-top: 20px; font-size: 12px; color: #666; }
        .switch-link a { color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="/" class="logo">N<span style="font-size: 0.85em;">e</span>X<span style="font-size: 0.85em;">ora</span></a>
        <h2>Member Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enter Store</button>
        </form>
        <p class="switch-link">Not a member? <a href="{% url 'register' %}">Request Access / Register</a></p>
    </div>
</body>
</html>
