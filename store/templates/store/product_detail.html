<div class="bg-zinc-900 border border-zinc-800 p-4 rounded">
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-80 object-cover mb-4">
    {% endif %}
    <h3 class="text-lg font-semibold">{{ product.name }}</h3>
    <p class="text-gray-400 mb-4">${{ product.price }}</p>

    <!-- PASTE WHATSAPP LINK HERE -->
    <a href="https://wa.me/2349113127527?text=Hello%20NeXora,%20I%20want%20to%20order%20{{ product.name|urlencode }}%20priced%20at%20${{ product.price }}" 
       target="_blank" 
       class="inline-block bg-green-600 text-white font-medium px-4 py-2 rounded hover:bg-green-500 transition">
       Order via WhatsApp
    </a>
</div>
